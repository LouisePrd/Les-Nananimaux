<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Les Nananimaux</title>
    <!-- styles du chargement en ligne : affichés avant que le JS et le CSS n'arrivent -->
    <style>
      #loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        background: #f8ede3;
        color: #63516a;
        font: 1.3rem 'Patrick Hand', 'Comic Sans MS', cursive;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        transition: opacity 0.5s;
      }
      #loader.done {
        opacity: 0;
        pointer-events: none;
      }
      .loader-dots {
        display: flex;
        gap: 12px;
      }
      .loader-dots span {
        width: 18px;
        height: 18px;
        border: 2.5px solid #63516a;
        border-radius: 50%;
        animation: loader-bounce 0.9s ease-in-out infinite;
      }
      .loader-dots span:nth-child(1) { background: #e63946; }
      .loader-dots span:nth-child(2) { background: #f4c430; animation-delay: 0.15s; }
      .loader-dots span:nth-child(3) { background: #1d4fd8; animation-delay: 0.3s; }
      .loader-dots span:nth-child(4) { background: #ff7eb6; animation-delay: 0.45s; }
      @keyframes loader-bounce {
        0%, 100% { transform: translateY(0) rotate(0); }
        50% { transform: translateY(-14px) rotate(-8deg); }
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute">
      <filter id="sketch">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" />
        <feDisplacementMap in="SourceGraphic" scale="3.5" />
      </filter>
    </svg>

    <div id="loader" role="status">
      <div class="loader-dots" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <p>Chargement…</p>
    </div>

    <main class="layout">
      <h1>Les Nananimaux</h1>

      <aside class="column column-left">
        <div id="carousels"></div>
        <div id="palettes"></div>
      </aside>

      <section class="stage-column">
        <div class="stage sketch">
          <canvas id="scene"></canvas>
        </div>
        <div class="bottom-row">
          <button id="favorite" class="sketch icon-button" aria-label="Garder dans la galerie"></button>
          <button id="generate" class="sketch">Générer</button>
          <button id="open-gallery" class="sketch">Galerie <span id="gallery-count"></span></button>
          <button id="swarm" class="sketch">Essaim</button>
        </div>
      </section>

      <aside class="column column-right">
        <div id="poses"></div>
        <div id="silhouette"></div>
      </aside>
    </main>

    <!-- Galerie des Nanas gardées -->
    <div id="gallery" class="gallery" hidden>
      <div class="gallery-panel sketch">
        <div class="gallery-header">
          <h2>Galerie</h2>
          <button class="gallery-close sketch" aria-label="Fermer">×</button>
        </div>
        <p class="gallery-empty">Aucune Nana gardée pour l'instant : cliquez sur ♡ pour garder celle qui vous plaît.</p>
        <div class="gallery-grid"></div>
      </div>
    </div>

    <!-- Essaim demandé alors que la galerie est vide -->
    <div id="swarm-notice" class="notice" hidden>
      <div class="notice-panel sketch" role="dialog" aria-labelledby="swarm-notice-title">
        <h2 id="swarm-notice-title">Essaim</h2>
        <p>
          L'essaim est une grande Nana générée à partir de de toutes les Nanas de votre galerie… qui est encore vide&nbsp;!
          Sauvegardez d'abord quelques Nanas avec ♡.
        </p>
        <button class="notice-close sketch">D'accord</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
